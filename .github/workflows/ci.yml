name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run repository guardrails
        run: make guardrails

      - name: Install Swift style tools
        run: ./Scripts/install_format_tools.sh install

      - name: Run Swift style lint
        run: make lint

      - name: Run conductor tests
        run: make conductor-selftest

      - name: Set up Node for pinned Codex CLI
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.159.0

      - name: Validate Codex app-server schema contract
        run: make dev-codex-schema-check

      - name: Run release workflow tests
        run: make release-selftest

      # Part of Style so each run starts one fewer macOS job. The package has no remote
      # dependencies, so it needs no cache.
      - name: Run provider package tests
        working-directory: Packages/RepoPromptAgentProviders
        run: swift test

  build-and-test:
    name: Build and Test (root shard ${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Every run restores; only main pushes save (shard 1, below). A cache saved on any
      # other branch is visible only to runs on that branch and pull requests targeting it.
      - name: Restore SwiftPM build cache
        id: root-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-root-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-root-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-root-

      - name: Build app product
        run: swift build --product RepoPrompt

      - name: Build MCP product
        run: swift build --product repoprompt-mcp

      - name: Run root test shard
        shell: bash
        run: |
          set -euo pipefail
          # `swift test list` discovers every root XCTest suite.
          # Each suite gets a fresh HOME/TMP/XDG sandbox and one XCTest process.
          # There are no retries or suite-specific clocks: a failure is a failure.
          python3 Scripts/ci_app_test_runner.py \
            --shard-count 4 \
            --shard-index "${{ matrix.shard }}"

      # The path must match the restore step's: the cache version hashes the path list, so
      # with a different path no restore could find what this step saves.
      - name: Save SwiftPM build cache (main, shard 1)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.root-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.root-cache.outputs.cache-primary-key }}

  # Pushes only (main and release/**); pull requests show it as skipped. It stays in this
  # workflow because a release candidate lands only when the CI run on its tip is green.
  sentry-enabled-build:
    name: Sentry-enabled Build
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Linking Sentry changes the build graph, so this cache is separate from the root one.
      - name: Restore SwiftPM build cache
        id: sentry-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-sentry-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-sentry-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-sentry-

      - name: Build app product with Sentry SDK linked
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: swift build --product RepoPrompt

      - name: Test serialized Sentry privacy boundary
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: swift test --filter SentryTelemetryPrivacyTests

      - name: Save SwiftPM build cache (main only)
        if: github.ref == 'refs/heads/main' && steps.sentry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.sentry-cache.outputs.cache-primary-key }}

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --connect-timeout 15 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan introduced commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            range="origin/main..$CURRENT_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            range="$CURRENT_SHA"
          fi
          echo "Scanning range: $range"
          gitleaks_command=(gitleaks git)
          if [[ -f .gitleaks.toml ]]; then
            gitleaks_command+=(--config .gitleaks.toml)
          fi
          "${gitleaks_command[@]}" --redact --log-opts="$range" .

      - name: Scan checked-in source tree
        run: |
          gitleaks_command=(gitleaks dir)
          if [[ -f .gitleaks.toml ]]; then
            gitleaks_command+=(--config .gitleaks.toml)
          fi
          "${gitleaks_command[@]}" --redact .
