name: CI

# A validation run, on a pull request or a push to `release/**`, tests the change. A push to
# `main` first asks GitHub whether the commit already passed as a release candidate: `main`
# moves by fast-forwarding to a candidate tip, so that run confirms the earlier result and
# stops, and a commit that didn't pass, or that the check can't confirm, gets a validation
# run. A refresh run, on the daily schedule or a `workflow_dispatch` from `main`, builds
# without testing so the SwiftPM caches that every other run restores stay fresh. The
# `changes` job owns the mode; `run-name` and `concurrency` can't read its outputs, so they
# test the event themselves. An empty `run-name` leaves every other run GitHub's default
# title.
run-name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'Cache refresh' || '' }}

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  schedule:
    - cron: '17 19 * * *'  # 03:17 Manila
  workflow_dispatch:

# Refresh runs share one group and never cancel a running one; GitHub keeps only the newest
# waiting refresh. A pull request's new run cancels its previous one, and every other run has
# a group of its own.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ci-cache-refresh' || format('ci-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Picks the run's mode: `landed` for a push to `main` whose commit already has a successful
  # run from a push to `release/**`, `cache-refresh` for the schedule and a dispatch, and
  # `validation` otherwise. A validation run then classifies its changed paths so the macOS
  # jobs can skip a change that touches only Markdown. A pull request is compared with its
  # base branch, a release candidate with `main`, and a push to `main` with the commits it
  # adds. Guardrails and the secret scan run on every validation run. A comparison the job
  # can't make, such as a force-push whose old head is gone, takes the full code path. A
  # refresh run never counts as Markdown-only, and a `workflow_dispatch` from any ref but
  # `main` fails here: only a cache saved on the default branch is visible to every pull
  # request. A failure here fails the run.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      markdown_only: ${{ steps.classify.outputs.markdown_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pick the mode and classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=validation
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::A cache refresh runs only from main, not from $GITHUB_REF. Dispatch the CI workflow from the main branch."
              exit 1
            fi
            mode=cache-refresh
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Testing is the safe direction: a failed request, or an answer without such a
            # run, leaves the commit in validation mode. Only stdout decides; a warning gh
            # writes to stderr must not read as a run. The filter checks every field itself
            # rather than trusting the query to have filtered them.
            query="head_sha=$CURRENT_SHA&status=success&event=push&per_page=100"
            filter='.workflow_runs[]
              | select(.head_sha == env.CURRENT_SHA and .event == "push" and .conclusion == "success"
                and (.head_branch | startswith("release/")))
              | "\(.head_branch) \(.html_url)"'
            gh_stderr="$RUNNER_TEMP/gh-api-stderr.txt"
            if landed="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?$query" \
                --jq "$filter" 2>"$gh_stderr")" && [[ -n "$landed" ]]; then
              echo "::notice::Already tested as a release candidate; skipping. Passed on $(head -1 <<<"$landed")"
              mode=landed
            else
              echo "No successful run from a release/** push found for $CURRENT_SHA; testing it. gh api stderr:"
              cat "$gh_stderr"
            fi
          fi
          if [[ "$mode" != "validation" ]]; then
            range=""
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            # The whole candidate: landing reads the run on its tip, so a Markdown commit
            # pushed on top of failing code must not skip the tests.
            range="origin/main...$CURRENT_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            range=""
          fi
          markdown_only=false
          # Deleted paths and both sides of a rename count. Anything but a nonempty list of
          # paths ending in lowercase `.md` keeps the full code path, including a git error.
          if [[ -n "$range" ]] && paths="$(git diff --name-only --no-renames "$range")"; then
            if [[ -n "$paths" ]] && ! grep -qv '\.md$' <<<"$paths"; then
              markdown_only=true
            fi
          fi
          echo "Mode: $mode; comparison: ${range:-none}; markdown_only=$markdown_only"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"

  # Validation runs only. On a Markdown-only change this job runs only guardrails and the
  # conductor tests, which check wording in README.md and
  # docs/architecture/developer-daemon.md. Guardrails need macOS (`xcrun swiftc`), so the job
  # stays there.
  style:
    name: Style
    needs: changes
    if: false  # [experiment, do not merge] skipped to save macOS minutes
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run repository guardrails
        run: make guardrails

      - name: Install Swift style tools
        if: needs.changes.outputs.markdown_only != 'true'
        run: ./Scripts/install_format_tools.sh install

      - name: Run Swift style lint
        if: needs.changes.outputs.markdown_only != 'true'
        run: make lint

      - name: Run conductor tests
        run: make conductor-selftest

      - name: Set up Node for pinned Codex CLI
        if: needs.changes.outputs.markdown_only != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned Codex CLI
        if: needs.changes.outputs.markdown_only != 'true'
        run: npm install --global @openai/codex@0.159.0

      - name: Validate Codex app-server schema contract
        if: needs.changes.outputs.markdown_only != 'true'
        run: make dev-codex-schema-check

      - name: Run release workflow tests
        if: needs.changes.outputs.markdown_only != 'true'
        run: make release-selftest

      # Part of Style so each run starts one fewer macOS job. The package has no remote
      # dependencies, so it needs no cache.
      - name: Run provider package tests
        if: needs.changes.outputs.markdown_only != 'true'
        working-directory: Packages/RepoPromptAgentProviders
        run: swift test

  build-and-test:
    name: Build and Test
    needs: changes
    if: false  # [experiment, do not merge] skipped to save macOS minutes
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Every run restores; only a refresh saves (below). A cache saved on any other branch
      # is visible only to runs on that branch and pull requests targeting it. A refresh
      # whose exact key already exists has nothing to build or save.
      - name: Restore SwiftPM build cache
        id: root-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-root-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-root-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-root-

      - name: Build app product
        if: needs.changes.outputs.mode != 'cache-refresh' || steps.root-cache.outputs.cache-hit != 'true'
        run: swift build --product RepoPrompt

      - name: Build MCP product
        if: needs.changes.outputs.mode != 'cache-refresh' || steps.root-cache.outputs.cache-hit != 'true'
        run: swift build --product repoprompt-mcp

      # A validation run builds the test bundles through `swift test list` below. They belong
      # in the cache, so a refresh builds them here.
      - name: Build root test bundles (refresh only)
        if: needs.changes.outputs.mode == 'cache-refresh' && steps.root-cache.outputs.cache-hit != 'true'
        run: swift build --build-tests

      - name: Run root tests
        if: needs.changes.outputs.mode != 'cache-refresh'
        shell: bash
        run: |
          set -euo pipefail
          # `swift test list` discovers every root XCTest suite.
          # Each suite gets a fresh HOME/TMP/XDG sandbox and one XCTest process.
          # There are no retries or suite-specific clocks: a failure is a failure,
          # and the runner stops at the first failing suite.
          python3 Scripts/ci_app_test_runner.py

      # The path must match the restore step's: the cache version hashes the path list, so
      # with a different path no restore could find what this step saves.
      - name: Save SwiftPM build cache (refresh only)
        if: needs.changes.outputs.mode == 'cache-refresh' && steps.root-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.root-cache.outputs.cache-primary-key }}

  # Validation pushes and refresh runs; pull requests, Markdown-only pushes, and landed
  # commits show it as skipped. It stays in this workflow because a release candidate lands
  # only when the CI run on its tip is green.
  sentry-enabled-build:
    name: Sentry-enabled Build
    needs: changes
    if: false  # [experiment, do not merge] skipped to save macOS minutes
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Linking Sentry changes the build graph, so this cache is separate from the root one.
      - name: Restore SwiftPM build cache
        id: sentry-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-sentry-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-sentry-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/RepoPromptAgentProviders/Package.swift', 'Packages/RepoPromptAgentProviders/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-sentry-

      - name: Build app product with Sentry SDK linked
        if: needs.changes.outputs.mode != 'cache-refresh' || steps.sentry-cache.outputs.cache-hit != 'true'
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: swift build --product RepoPrompt

      # The test step below builds the test bundles with Sentry linked. A refresh skips that
      # step, so it builds them here for the cache.
      - name: Build test bundles with Sentry SDK linked (refresh only)
        if: needs.changes.outputs.mode == 'cache-refresh' && steps.sentry-cache.outputs.cache-hit != 'true'
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: swift build --build-tests

      - name: Test serialized Sentry privacy boundary
        if: needs.changes.outputs.mode != 'cache-refresh'
        env:
          REPOPROMPT_ENABLE_SENTRY: "1"
        run: swift test --filter SentryTelemetryPrivacyTests

      - name: Save SwiftPM build cache (refresh only)
        if: needs.changes.outputs.mode == 'cache-refresh' && steps.sentry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.sentry-cache.outputs.cache-primary-key }}

  # Validation runs only: a refresh introduces no commits, and a landed commit was scanned on
  # its candidate.
  secret-scan:
    name: Secret Scan
    needs: changes
    if: false  # [experiment, do not merge] skipped; the branch adds only workflow steps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --connect-timeout 15 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan introduced commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            range="origin/main..$CURRENT_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            range="$CURRENT_SHA"
          fi
          # gitleaks scans 0 commits and passes when an endpoint doesn't resolve, so fail here
          # instead, for example after a force-push whose old head is no longer fetchable.
          commit_count="$(git rev-list --count "$range")"
          echo "Scanning range: $range, commit count: $commit_count"
          gitleaks_command=(gitleaks git)
          if [[ -f .gitleaks.toml ]]; then
            gitleaks_command+=(--config .gitleaks.toml)
          fi
          "${gitleaks_command[@]}" --redact --log-opts="$range" .

      - name: Scan checked-in source tree
        run: |
          gitleaks_command=(gitleaks dir)
          if [[ -f .gitleaks.toml ]]; then
            gitleaks_command+=(--config .gitleaks.toml)
          fi
          "${gitleaks_command[@]}" --redact .

  # [experiment, do not merge] Iteration 4 of the macOS-minute optimization. A restored SwiftPM
  # `.build` recompiles every first-party module because a fresh checkout gives every source a
  # new inode and mtime. llbuild re-runs each command regardless (its FileInfo compares inode),
  # which hands the decision to the Swift driver, which skips a source only when its mtime
  # equals the build record's (or, with -enable-incremental-file-hashing, when its content
  # hash does). One job seeds `.build`, recreates every tracked file in place, and measures
  # the `] Compiling` lines per module for each arm, resetting `.build` from an APFS clone of
  # the seed between arms:
  #   A  no normalization (control; measured in run 39225985371 and not repeated)
  #   B  mtimes restored from a record taken before the seed, only for unchanged blobs
  #   B' mtimes recomputed from each file's blob ID, no record (the permanent candidate)
  #   D  B' plus a one-file change to a widely used RepoPromptApp type
  #   C  -enable-incremental-file-hashing on its own seed, no normalization
  cache-reuse-experiment:
    name: Cache reuse experiment
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CHANGED_FILE: Sources/RepoPrompt/Infrastructure/WorkspaceContext/Slices/LineRange.swift
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Toolchain and workspace facts
        shell: bash
        run: |
          set -euo pipefail
          echo "EXP=$RUNNER_TEMP/exp" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version
          echo "workspace: $PWD"
          echo "tracked paths: $(git ls-files | wc -l | tr -d ' ')"
          if swiftc -help-hidden 2>/dev/null | grep -q -- '-enable-incremental-file-hashing'; then
            echo "driver offers -enable-incremental-file-hashing"
            echo "HASHING_FLAG=yes" >> "$GITHUB_ENV"
          else
            echo "driver lacks -enable-incremental-file-hashing"
            echo "HASHING_FLAG=no" >> "$GITHUB_ENV"
          fi

      - name: Write experiment helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXP"
          cat > "$EXP/mtimes.py" <<'PY'
          """Tracked-file mtime helpers: record <json> | restore <json> | normalize | show <path>...

          A file's identity is the SHA-1 of its working-tree content, not its index blob: the index
          doesn't see an unstaged edit, and a tracked file can be edited after checkout.
          """
          import hashlib
          import json
          import os
          import stat
          import subprocess
          import sys


          def tracked():
              """Yield (path, content SHA-1) for every tracked regular file; skips symlinks and gitlinks."""
              out = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True).stdout
              for raw in out.split(b"\0"):
                  if not raw:
                      continue
                  path = raw.decode()
                  try:
                      st = os.lstat(path)
                  except FileNotFoundError:
                      continue
                  if not stat.S_ISREG(st.st_mode):
                      continue
                  digest = hashlib.sha1()
                  with open(path, "rb") as f:
                      for chunk in iter(lambda: f.read(1 << 20), b""):
                          digest.update(chunk)
                  yield path, digest.hexdigest()


          def deterministic_mtime_ns(content_id):
              h = int(content_id[:15], 16)
              seconds = 1_000_000_000 + h % 500_000_000  # 2001-09-09 .. 2017-07-14
              nanoseconds = (h >> 29) % 1_000_000_000
              return seconds * 1_000_000_000 + nanoseconds


          def set_mtime(path, mtime_ns):
              os.utime(path, ns=(os.lstat(path).st_atime_ns, mtime_ns))


          command = sys.argv[1]
          if command == "record":
              record = {}
              for path, content_id in tracked():
                  st = os.lstat(path)
                  record[path] = {"content_id": content_id, "mtime_ns": st.st_mtime_ns, "inode": st.st_ino}
              with open(sys.argv[2], "w") as f:
                  json.dump(record, f)
              print(f"recorded {len(record)} tracked regular files")
          elif command == "restore":
              with open(sys.argv[2]) as f:
                  record = json.load(f)
              restored = changed = added = 0
              seen = set()
              for path, content_id in tracked():
                  seen.add(path)
                  previous = record.get(path)
                  if previous is None:
                      added += 1
                  elif previous["content_id"] != content_id:
                      changed += 1
                  else:
                      set_mtime(path, previous["mtime_ns"])
                      restored += 1
              print(f"restored {restored}, changed {changed}, added {added}, removed {len(set(record) - seen)}")
          elif command == "normalize":
              count = 0
              for path, content_id in tracked():
                  set_mtime(path, deterministic_mtime_ns(content_id))
                  count += 1
              print(f"normalized {count} tracked regular files")
          elif command == "show":
              for path in sys.argv[2:]:
                  st = os.lstat(path)
                  print(f"{path}: inode={st.st_ino} mtime_ns={st.st_mtime_ns}")
          else:
              sys.exit(f"unknown command {command}")
          PY

          cat > "$EXP/count.sh" <<'SH'
          #!/bin/bash
          # Usage: count.sh <log>: `] Compiling` lines per module, plus other build activity.
          set -euo pipefail
          log="$1"
          echo "Compiling lines: $(grep -c '\] Compiling ' "$log" || true)"
          echo "By module:"
          grep '\] Compiling ' "$log" | sed -E 's/.*\] Compiling //' \
            | awk '{ print (NF >= 2) ? $1 : "(C/C++ file without a module name)" }' | sort | uniq -c | sort -rn || true
          echo "Emitting module: $(grep -c '\] Emitting module' "$log" || true); Linking: $(grep -c '\] Linking' "$log" || true); Write sources: $(grep -c '\] Write sources' "$log" || true)"
          SH

          cat > "$EXP/build.sh" <<'SH'
          #!/bin/bash
          # Usage: build.sh <label> <swift build args...>. Logs to $EXP/<label>.log with elapsed
          # seconds per line, appends a section to the step summary, and exports
          # <label>_SWIFT_COMPILES (Swift source compiles) to later steps.
          set -euo pipefail
          label="$1"; shift
          log="$EXP/$label.log"
          start=$(date +%s)
          set +e
          swift build "$@" 2>&1 \
            | perl -MTime::HiRes=time -ne 'BEGIN { $| = 1; $t0 = time() } printf("%7.1f %s", time() - $t0, $_)' \
            | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - start ))
          at() { grep -m1 "$1" "$log" | awk '{ print $1 }' || true; }
          {
            echo "## $label: swift build $* — ${elapsed}s, exit $status"
            echo '```'
            "$EXP/count.sh" "$log"
            echo "seconds to: planning $(at 'Planning build'); first compile $(at '\] Compiling '); first link $(at '\] Linking'); complete $(at 'Build .*complete')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # `grep` exits 1 on zero matches, which is the result this experiment hopes for.
          swift_compiles=$( (grep '\] Compiling ' "$log" || true) | sed -E 's/.*\] Compiling //' | awk 'NF >= 2 && $2 ~ /\.swift$/ { n++ } END { print n + 0 }')
          echo "${label}_SWIFT_COMPILES=$swift_compiles" >> "$GITHUB_ENV"
          exit "$status"
          SH

          cat > "$EXP/recheckout.sh" <<'SH'
          #!/bin/bash
          # Recreate every tracked file in place (new inode, new mtime), keeping .git, .build and the
          # seed clones, like a fresh actions/checkout at the same path.
          set -euo pipefail
          echo "before: $(python3 "$EXP/mtimes.py" show "$CHANGED_FILE")"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .build ! -name '.build-seed*' -exec rm -rf {} +
          git checkout -- .
          echo "after:  $(python3 "$EXP/mtimes.py" show "$CHANGED_FILE")"
          dirty=$(git status --porcelain --untracked-files=no)
          if [[ -n "$dirty" ]]; then
            echo "::error::worktree dirty after re-checkout"; echo "$dirty"; exit 1
          fi
          echo "re-checkout complete: $(git ls-files | wc -l | tr -d ' ') tracked paths"
          SH

          cat > "$EXP/reset.sh" <<'SH'
          #!/bin/bash
          # Usage: reset.sh <seed-dir>: replace .build with an APFS clone of the seed (new inodes,
          # same mtimes, like a cache restore).
          set -euo pipefail
          seed="$1"
          start=$(date +%s)
          rm -rf .build
          cp -cRp "$seed" .build
          echo "reset .build from $seed in $(( $(date +%s) - start ))s; entries $(find .build | wc -l | tr -d ' ') vs seed $(find "$seed" | wc -l | tr -d ' ')"
          sample=$(find .build -name '*.swiftmodule' -type f | head -1)
          echo "sample: $(python3 "$EXP/mtimes.py" show "$sample")"
          echo "seed:   $(python3 "$EXP/mtimes.py" show "$seed/${sample#.build/}")"
          SH
          chmod +x "$EXP"/*.sh
          ls -la "$EXP"

      - name: Normalize tracked-file mtimes by blob ID, then record them
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXP/mtimes.py" show Package.swift "$CHANGED_FILE"
          time python3 "$EXP/mtimes.py" normalize
          python3 "$EXP/mtimes.py" record "$EXP/seed1.json"
          python3 "$EXP/mtimes.py" show Package.swift "$CHANGED_FILE"
          git status --porcelain --untracked-files=no | head -5

      - name: Seed 1 — app product
        shell: bash
        run: |
          "$EXP/build.sh" seed1_app --product RepoPrompt

      - name: Seed 1 — test bundles
        shell: bash
        run: |
          "$EXP/build.sh" seed1_tests --build-tests

      - name: Clone .build as seed 1
        shell: bash
        run: |
          set -euo pipefail
          time cp -cRp .build .build-seed1
          du -sh .build .build-seed1

      - name: Re-checkout (fresh inodes and mtimes)
        shell: bash
        run: |
          "$EXP/recheckout.sh"

      - name: Arm B — reset .build, restore recorded mtimes for unchanged blobs
        shell: bash
        run: |
          set -euo pipefail
          "$EXP/reset.sh" .build-seed1
          time python3 "$EXP/mtimes.py" restore "$EXP/seed1.json"
          python3 "$EXP/mtimes.py" show Package.swift "$CHANGED_FILE"

      - name: Arm B — app product
        shell: bash
        run: |
          "$EXP/build.sh" armB_app --product RepoPrompt

      - name: Arm B — test bundles
        shell: bash
        run: |
          "$EXP/build.sh" armB_tests --build-tests

      - name: Arm B' — reset .build, re-checkout, recompute mtimes from blob IDs
        shell: bash
        run: |
          set -euo pipefail
          "$EXP/reset.sh" .build-seed1
          "$EXP/recheckout.sh"
          time python3 "$EXP/mtimes.py" normalize
          python3 "$EXP/mtimes.py" show Package.swift "$CHANGED_FILE"

      - name: Arm B' — app product
        shell: bash
        run: |
          "$EXP/build.sh" armBprime_app --product RepoPrompt

      - name: Arm D — reset .build, re-checkout, change one file, recompute mtimes
        shell: bash
        run: |
          set -euo pipefail
          "$EXP/reset.sh" .build-seed1
          "$EXP/recheckout.sh"
          cat >> "$CHANGED_FILE" <<'SWIFT'

          // [experiment] A new member on a widely used type, so its dependents recompile too.
          extension LineRange {
              var experimentLineCount: Int { end - start + 1 }
          }
          SWIFT
          git status --porcelain --untracked-files=no
          python3 "$EXP/mtimes.py" normalize
          python3 "$EXP/mtimes.py" show Package.swift "$CHANGED_FILE"

      - name: Arm D — app product
        shell: bash
        run: |
          "$EXP/build.sh" armD_app --product RepoPrompt

      - name: Arm D — test bundles
        shell: bash
        run: |
          "$EXP/build.sh" armD_tests --build-tests

      - name: Seed 2 — reset .build, re-checkout, app product with -enable-incremental-file-hashing
        if: env.HASHING_FLAG == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          "$EXP/reset.sh" .build-seed1
          "$EXP/recheckout.sh"
          "$EXP/build.sh" seed2_app --product RepoPrompt -Xswiftc -enable-incremental-file-hashing

      - name: Arm C — re-checkout, hashing flag, no normalization
        if: env.HASHING_FLAG == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          "$EXP/recheckout.sh"
          "$EXP/build.sh" armC_app --product RepoPrompt -Xswiftc -enable-incremental-file-hashing

      - name: Arm summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Swift source compiles per arm"
            echo '```'
            env | grep '_SWIFT_COMPILES=' | sort || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
